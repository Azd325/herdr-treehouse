name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq dash shellcheck
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install jq dash shellcheck
      - name: Test with sh
        run: sh test/run.sh
      - name: Shell check
        run: shellcheck bin/refresh.sh test/run.sh test/bin/herdr test/bin/treehouse
      - name: Use dash as sh
        run: |
          mkdir -p "$RUNNER_TEMP/dash-bin"
          ln -s "$(command -v dash)" "$RUNNER_TEMP/dash-bin/sh"
          printf '%s\n' "$RUNNER_TEMP/dash-bin" >> "$GITHUB_PATH"
      - name: Test with dash as sh
        run: sh test/run.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
      - name: Check workflow files
        env:
          ACTIONLINT: ${{ steps.get_actionlint.outputs.executable }}
        run: $ACTIONLINT -color
